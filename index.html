<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Study Material</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f3f4f6;
      overflow: hidden;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 10;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 420px;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    .badge {
      background: #e0e7ff;
      color: #3730a3;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 16px;
    }

    .card h1 {
      margin: 0;
      font-size: 22px;
      color: #111827;
      text-align: center;
    }

    .card p {
      font-size: 14px;
      color: #4b5563;
      text-align: center;
      margin: 10px 0 22px;
      line-height: 1.5;
    }

    .card input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 15px;
      outline: none;
    }

    .card input:focus {
      border-color: #2563eb;
    }

    .card button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .card button:hover {
      background: #1e40af;
    }

    .footer-text {
      margin-top: 14px;
      font-size: 12px;
      color: #6b7280;
      text-align: center;
    }

    .blink {
      animation: blink 0.25s infinite;
    }

    @keyframes blink {
      0% { background: black; }
      50% { background: white; }
      100% { background: black; }
    }

    @media (max-width: 480px) {
      .card {
        padding: 22px;
      }

      .card h1 {
        font-size: 20px;
      }

      .card p {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<div class="overlay" id="overlay">
  <div class="card">
    <div style="text-align:center">
      <div class="badge">FREE PDF • UPDATED 2026</div>
    </div>

    <h1>Engineering Study Material</h1>
    <p>
      Download high-quality notes, PYQs, and exam-oriented material curated by
      experienced faculty.
    </p>

    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="College Email ID" required>

    <button onclick="startPrank()">Download Study Material</button>

    <div class="footer-text">
      Trusted by 12,000+ students • Secure access • No spam
    </div>
  </div>
</div>

<audio id="sound" loop>
  <source src="Tatya.mp3" type="audio/mpeg">
</audio>

<script>
  function startPrank() {
    document.getElementById("overlay").style.display = "none"
    document.body.classList.add("blink")

    const audio = document.getElementById("sound")
    audio.volume = 1.0
    audio.play()

    document.documentElement.requestFullscreen?.()
  }
</script>

</body>
</html>
