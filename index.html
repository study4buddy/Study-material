<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Download Study Material</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f3f4f6;
      overflow: hidden;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .card {
      background: white;
      width: 360px;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    .card h1 {
      margin: 0;
      font-size: 22px;
      color: #1f2937;
      text-align: center;
    }

    .card p {
      font-size: 14px;
      color: #4b5563;
      text-align: center;
      margin: 10px 0 20px;
    }

    .badge {
      background: #e0e7ff;
      color: #3730a3;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      display: inline-block;
      margin-bottom: 15px;
    }

    .card input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }

    .card button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .card button:hover {
      background: #1e40af;
    }

    .footer-text {
      margin-top: 12px;
      font-size: 12px;
      color: #6b7280;
      text-align: center;
    }

    .blink {
      animation: blink 0.25s infinite;
    }

    @keyframes blink {
      0% { background: black; }
      50% { background: white; }
      100% { background: black; }
    }
  </style>
</head>

<body>

<div class="overlay" id="overlay">
  <div class="card">
    <div style="text-align:center">
      <div class="badge">FREE PDF • UPDATED 2026</div>
    </div>
    <h1>Engineering Study Material</h1>
    <p>Get curated notes, previous year questions, and exam-focused PDFs directly.</p>

    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="College Email ID" required>

    <button onclick="startPrank()">Download Study Material</button>

    <div class="footer-text">
      Trusted by 12,000+ students • No spam
    </div>
  </div>
</div>

<audio id="sound" loop>
  <source src="Tatya.mp3" type="audio/mpeg">
</audio>

<script>
  function startPrank() {
    document.getElementById("overlay").style.display = "none"
    document.body.classList.add("blink")

    const audio = document.getElementById("sound")
    audio.volume = 1.0
    audio.play()

    document.documentElement.requestFullscreen?.()
  }
</script>

</body>
</html>
